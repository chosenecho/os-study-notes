<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title"><title id="title">自编 load-use 停顿与转发</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#365fa5"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="system-ui,Microsoft YaHei,sans-serif" fill="#17243b"><text x="30" y="42" font-size="26" text-anchor="start">五段模型：加载到 MEM 结束才可供后继使用</text><text x="306.0" y="95" font-size="18" text-anchor="middle">周期 1</text><text x="398.0" y="95" font-size="18" text-anchor="middle">周期 2</text><text x="490.0" y="95" font-size="18" text-anchor="middle">周期 3</text><text x="582.0" y="95" font-size="18" text-anchor="middle">周期 4</text><text x="674.0" y="95" font-size="18" text-anchor="middle">周期 5</text><text x="766.0" y="95" font-size="18" text-anchor="middle">周期 6</text><text x="858.0" y="95" font-size="18" text-anchor="middle">周期 7</text><text x="25" y="152" font-size="21" text-anchor="start">lw r2, 0(r1)</text><text x="25" y="242" font-size="21" text-anchor="start">add r5, r2, r3</text><rect x="260" y="115" width="84" height="60" rx="6" fill="#edf3ff" stroke="#526b8a"/><text x="302.0" y="151.0" font-size="18" text-anchor="middle">IF</text><rect x="352" y="115" width="84" height="60" rx="6" fill="#edf3ff" stroke="#526b8a"/><text x="394.0" y="151.0" font-size="18" text-anchor="middle">ID</text><rect x="444" y="115" width="84" height="60" rx="6" fill="#edf3ff" stroke="#526b8a"/><text x="486.0" y="151.0" font-size="18" text-anchor="middle">EX</text><rect x="536" y="115" width="84" height="60" rx="6" fill="#edf3ff" stroke="#526b8a"/><text x="578.0" y="151.0" font-size="18" text-anchor="middle">MEM</text><rect x="628" y="115" width="84" height="60" rx="6" fill="#edf3ff" stroke="#526b8a"/><text x="670.0" y="151.0" font-size="18" text-anchor="middle">WB</text><rect x="352" y="205" width="84" height="60" rx="6" fill="#edf3ff" stroke="#526b8a"/><text x="394.0" y="241.0" font-size="18" text-anchor="middle">IF</text><rect x="444" y="205" width="84" height="60" rx="6" fill="#edf3ff" stroke="#526b8a"/><text x="486.0" y="241.0" font-size="18" text-anchor="middle">ID</text><rect x="536" y="205" width="84" height="60" rx="6" fill="#fff0cc" stroke="#526b8a"/><text x="578.0" y="241.0" font-size="18" text-anchor="middle">ID 暂停</text><rect x="628" y="205" width="84" height="60" rx="6" fill="#edf3ff" stroke="#526b8a"/><text x="670.0" y="241.0" font-size="18" text-anchor="middle">EX</text><rect x="720" y="205" width="84" height="60" rx="6" fill="#edf3ff" stroke="#526b8a"/><text x="762.0" y="241.0" font-size="18" text-anchor="middle">MEM</text><rect x="812" y="205" width="84" height="60" rx="6" fill="#edf3ff" stroke="#526b8a"/><text x="854.0" y="241.0" font-size="18" text-anchor="middle">WB</text><polyline points="582,178 582,195 674,195 674,203" fill="none" stroke="#365fa5" stroke-width="3" marker-end="url(#arrow)"/><text x="300" y="310" font-size="21" text-anchor="start">周期 4 的 EX 插入气泡，已加载的数据转发到周期 5 的 EX。</text><text x="30" y="365" font-size="19" text-anchor="start">假设：顺序五级流水、常规转发、忽略其他冲突和 Cache 未命中；停顿数依模型而定。</text></g></svg>
