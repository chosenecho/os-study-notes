<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title"><title id="title">自编 Load/Store 数据路径</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#365fa5"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="system-ui,Microsoft YaHei,sans-serif" fill="#17243b"><text x="32" y="42" font-size="26" text-anchor="start">Load/Store：先确定状态变化，再选择数据与写使能</text><rect x="35" y="125" width="130" height="60" rx="6" fill="#edf3ff" stroke="#526b8a"/><text x="100.0" y="163.0" font-size="24" text-anchor="middle">PC</text><rect x="220" y="125" width="175" height="60" rx="6" fill="#edf3ff" stroke="#526b8a"/><text x="307.5" y="163.0" font-size="24" text-anchor="middle">取指与译码</text><rect x="450" y="105" width="180" height="100" rx="6" fill="#edf3ff" stroke="#526b8a"/><text x="540.0" y="163.0" font-size="24" text-anchor="middle">寄存器堆</text><rect x="735" y="125" width="190" height="60" rx="6" fill="#edf3ff" stroke="#526b8a"/><text x="830.0" y="163.0" font-size="24" text-anchor="middle">ALU / 地址</text><rect x="735" y="285" width="190" height="70" rx="6" fill="#edf3ff" stroke="#526b8a"/><text x="830.0" y="328.0" font-size="24" text-anchor="middle">数据存储器</text><polyline points="165,155 218,155" fill="none" stroke="#365fa5" stroke-width="3" marker-end="url(#arrow)"/><polyline points="395,155 448,155" fill="none" stroke="#365fa5" stroke-width="3" marker-end="url(#arrow)"/><polyline points="630,155 733,155" fill="none" stroke="#365fa5" stroke-width="3" marker-end="url(#arrow)"/><polyline points="830,185 830,283" fill="none" stroke="#365fa5" stroke-width="3" marker-end="url(#arrow)"/><text x="650" y="125" font-size="18" text-anchor="start">基址 + 位移</text><polyline points="540,205 540,320 733,320" fill="none" stroke="#365fa5" stroke-width="3" marker-end="url(#arrow)"/><text x="560" y="304" font-size="18" text-anchor="start">sw 待写数据</text><polyline points="830,355 830,395 485,395 485,207" fill="none" stroke="#365fa5" stroke-width="3" marker-end="url(#arrow)"/><text x="520" y="383" font-size="20" text-anchor="start">lw：内存结果写回寄存器</text><text x="35" y="435" font-size="20" text-anchor="start">示意模型省略控制线和选择器；sw 不写回通用寄存器，PC 按指令规则更新。</text></g></svg>
