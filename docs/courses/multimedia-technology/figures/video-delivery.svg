<svg xmlns="http://www.w3.org/2000/svg" width="900" height="385" viewBox="0 0 900 385" role="img" aria-labelledby="title desc">
<title id="title">剪辑工程与播放文件分别交付</title><desc id="desc">素材经项目设置、时间线编辑、字幕音轨与效果处理后保存工程，再输出播放文件。</desc>
<rect width="900" height="385" rx="12" fill="#fff"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#315ba8"/></marker></defs>
<g font-family="Microsoft YaHei,Arial,sans-serif" fill="#17243b">
<text x="35" y="40" font-size="24" font-weight="600">剪辑工程与播放文件分别交付</text>
<path d="M285 129L321 129" stroke="#315ba8" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>
<path d="M575 129L611 129" stroke="#315ba8" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>
<path d="M740.0 176L740.0 220" stroke="#315ba8" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>
<path d="M615 271L579 271" stroke="#315ba8" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>
<path d="M325 271L289 271" stroke="#315ba8" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>
<rect x="35" y="82" width="250" height="94" rx="8" fill="#eef3fc" stroke="#b9c9e3"/>
<text x="160.0" y="117" text-anchor="middle" font-size="21" font-weight="600">素材</text>
<text x="160.0" y="147" text-anchor="middle" font-size="18">来源、路径和输入条件</text>
<rect x="325" y="82" width="250" height="94" rx="8" fill="#eef3fc" stroke="#b9c9e3"/>
<text x="450.0" y="117" text-anchor="middle" font-size="21" font-weight="600">项目设置</text>
<text x="450.0" y="147" text-anchor="middle" font-size="18">确认编辑与输出要求</text>
<rect x="615" y="82" width="250" height="94" rx="8" fill="#eef3fc" stroke="#b9c9e3"/>
<text x="740.0" y="117" text-anchor="middle" font-size="21" font-weight="600">时间线</text>
<text x="740.0" y="147" text-anchor="middle" font-size="18">片段顺序及裁剪</text>
<rect x="615" y="224" width="250" height="94" rx="8" fill="#eef3fc" stroke="#b9c9e3"/>
<text x="740.0" y="259" text-anchor="middle" font-size="21" font-weight="600">字幕、声音与效果</text>
<text x="740.0" y="289" text-anchor="middle" font-size="18">核对衔接和音画对应</text>
<rect x="325" y="224" width="250" height="94" rx="8" fill="#eef3fc" stroke="#b9c9e3"/>
<text x="450.0" y="259" text-anchor="middle" font-size="21" font-weight="600">保存工程</text>
<text x="450.0" y="289" text-anchor="middle" font-size="18">关联素材仍须保留</text>
<rect x="35" y="224" width="250" height="94" rx="8" fill="#eef3fc" stroke="#b9c9e3"/>
<text x="160.0" y="259" text-anchor="middle" font-size="21" font-weight="600">输出影片</text>
<text x="160.0" y="289" text-anchor="middle" font-size="18">独立打开并完整播放</text>
<text x="35" y="360" font-size="17">保存工程不能代替输出；播放成功也不能代替内容、字幕和声音检查。</text>
</g></svg>
