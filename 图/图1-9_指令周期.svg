<svg xmlns="http://www.w3.org/2000/svg" width="700" height="180" viewBox="0 0 700 180" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="20" y="76" width="96" height="44" rx="22" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="68" y="103" font-size="14" fill="#334155" text-anchor="middle">开始</text>

  <line x1="116" y1="98" x2="146" y2="98" stroke="#64748b" stroke-width="1.4" marker-end="url(#f)"/>

  <rect x="150" y="70" width="180" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="240" y="104" font-size="15" fill="#1e293b" text-anchor="middle">取下一条指令</text>

  <line x1="330" y1="98" x2="392" y2="98" stroke="#64748b" stroke-width="1.4" marker-end="url(#f)"/>

  <rect x="396" y="70" width="160" height="56" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <text x="476" y="104" font-size="15" fill="#1e293b" text-anchor="middle">执行指令</text>

  <line x1="556" y1="98" x2="596" y2="98" stroke="#64748b" stroke-width="1.4" marker-end="url(#f)"/>

  <rect x="600" y="76" width="86" height="44" rx="22" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="643" y="103" font-size="14" fill="#334155" text-anchor="middle">停止</text>

  <path d="M476,70 L476,34 L240,34 L240,66" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#f)"/>

  <text x="240" y="24" font-size="12" fill="#2563eb" text-anchor="middle">取指周期</text>
  <text x="476" y="150" font-size="12" fill="#d97706" text-anchor="middle">执行周期</text>
  <text x="476" y="170" font-size="12" fill="#64748b" text-anchor="middle">执行完再回去取下一条</text>
</svg>
