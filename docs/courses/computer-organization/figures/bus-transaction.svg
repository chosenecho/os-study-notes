<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title"><title id="title">自编四周期同步总线事务时序</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#365fa5"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="system-ui,Microsoft YaHei,sans-serif" fill="#17243b"><text x="30" y="42" font-size="26" text-anchor="start">一次事务四周期，只交付一个 32 位数据字</text><text x="275.0" y="82" font-size="21" text-anchor="middle">周期 1</text><text x="455.0" y="82" font-size="21" text-anchor="middle">周期 2</text><text x="635.0" y="82" font-size="21" text-anchor="middle">周期 3</text><text x="815.0" y="82" font-size="21" text-anchor="middle">周期 4</text><polyline points="185,130 185,105 275.0,105 275.0,130 365,130 365,130 365,105 455.0,105 455.0,130 545,130 545,130 545,105 635.0,105 635.0,130 725,130 725,130 725,105 815.0,105 815.0,130 905,130" fill="none" stroke="#365fa5" stroke-width="3"/><text x="30" y="125" font-size="19" text-anchor="start">50 MHz 时钟</text><text x="30" y="195" font-size="20" text-anchor="start">事务阶段</text><rect x="185" y="160" width="172" height="50" rx="6" fill="#edf3ff" stroke="#526b8a"/><text x="271.0" y="192.0" font-size="21" text-anchor="middle">地址 / 请求</text><rect x="365" y="160" width="172" height="50" rx="6" fill="#edf3ff" stroke="#526b8a"/><text x="451.0" y="192.0" font-size="21" text-anchor="middle">等待</text><rect x="545" y="160" width="172" height="50" rx="6" fill="#edf3ff" stroke="#526b8a"/><text x="631.0" y="192.0" font-size="21" text-anchor="middle">等待</text><rect x="725" y="160" width="172" height="50" rx="6" fill="#edf3ff" stroke="#526b8a"/><text x="811.0" y="192.0" font-size="21" text-anchor="middle">数据采样</text><text x="30" y="280" font-size="20" text-anchor="start">本次有效数据</text><rect x="185" y="240" width="172" height="50" rx="6" fill="#f4f5f7" stroke="#526b8a"/><text x="271.0" y="272.0" font-size="21" text-anchor="middle">—</text><rect x="365" y="240" width="172" height="50" rx="6" fill="#f4f5f7" stroke="#526b8a"/><text x="451.0" y="272.0" font-size="21" text-anchor="middle">—</text><rect x="545" y="240" width="172" height="50" rx="6" fill="#f4f5f7" stroke="#526b8a"/><text x="631.0" y="272.0" font-size="21" text-anchor="middle">—</text><rect x="725" y="240" width="172" height="50" rx="6" fill="#e8f3ea" stroke="#526b8a"/><text x="811.0" y="272.0" font-size="21" text-anchor="middle">32 bit</text><text x="30" y="360" font-size="21" text-anchor="start">节拍上限：4 B × 50 MHz = 200 MB/s；本事务：4 B ÷ 80 ns = 50 MB/s。</text><text x="30" y="405" font-size="21" text-anchor="start">自编协议约定，连续事务无间隙；仲裁、额外等待及具体接口采样要求未计。</text></g></svg>
