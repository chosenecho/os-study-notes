# Included in nginx's http context. Origin authentication map is provisioned
# separately in /etc/nginx/conf.d/10-studynote-auth.conf (root-only secret).
log_format studynote '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
    '$status $body_bytes_sent host=$host edge_client=$http_ali_cdn_real_ip '
    'request_time=$request_time';
map $uri $studynote_asset_cache {
    default "public, max-age=300, must-revalidate";
    ~^/assets/(stylesheets/(main|palette)\.|javascripts/(bundle\.|workers/search\.)) "public, max-age=31536000, immutable";
    ~^/assets/(vendor|images)/ "public, max-age=86400";
    ~^/courses/(operating-systems|computer-organization)/figures/ "public, max-age=86400";
    ~^/\.well-known/acme-challenge/ "no-store";
    ~^/__release\.json$ "no-store";
}
map $status $studynote_cache_control {
    default $studynote_asset_cache;
    ~^[45] "no-store";
}
