<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330">
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#334155"/></marker></defs>
<rect width="900" height="330" fill="#fff"/>
<g font-family="Microsoft YaHei, sans-serif" text-anchor="middle" fill="#172033">
<text x="450" y="40" font-size="23" font-weight="700">进程三种基本状态及转换</text>
<rect x="90" y="116" width="190" height="78" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="185" y="163" font-size="22">就绪</text>
<rect x="355" y="116" width="190" height="78" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="450" y="163" font-size="22">执行</text>
<rect x="620" y="116" width="190" height="78" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="715" y="163" font-size="22">阻塞</text>
<path d="M280 137H350" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><text x="315" y="120" font-size="15">调度</text>
<path d="M355 177H285" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><text x="320" y="215" font-size="15">时间片用完／抢占</text>
<path d="M545 137H615" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><text x="580" y="120" font-size="15">等待事件／资源</text>
<path d="M715 194V245H185V200" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><text x="570" y="235" font-size="15">事件发生／资源可用：唤醒后进入就绪态</text>
<text x="450" y="280" font-size="16" fill="#475569">阻塞进程被唤醒后先进入就绪态，获得 CPU 后才进入执行态</text>
</g></svg>
