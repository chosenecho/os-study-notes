# ESA serves one content host; the apex only redirects to it.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/studynote/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studynote/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 444;
}
server {
    listen 80;
    listen [::]:80;
    server_name chosenecho.top studynote.chosenecho.top;
    if ($studynote_origin_allowed = 0) { return 403; }
    add_header Cache-Control no-store always;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        try_files $uri =404;
    }
    location / { return 301 https://studynote.chosenecho.top$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chosenecho.top;
    server_tokens off;
    if ($studynote_origin_allowed = 0) { return 403; }
    ssl_certificate /etc/letsencrypt/live/studynote/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studynote/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    add_header Cache-Control no-store always;
    add_header Strict-Transport-Security "max-age=2592000" always;
    access_log /var/log/nginx/studynote.access.log studynote;
    error_log /var/log/nginx/studynote.error.log warn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        try_files $uri =404;
    }
    location / { return 301 https://studynote.chosenecho.top$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name studynote.chosenecho.top;
    root /var/www/studynote/current;
    index index.html;
    autoindex off;
    server_tokens off;
    client_max_body_size 1k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 20s;
    if ($studynote_origin_allowed = 0) { return 403; }
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    ssl_certificate /etc/letsencrypt/live/studynote/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studynote/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:studynoteTLS:5m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    # .mjs must be JavaScript when nosniff is enabled (Ubuntu nginx 1.18).
    include /etc/nginx/mime.types;
    types { application/javascript mjs; }
    default_type application/octet-stream;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    add_header Cache-Control $studynote_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=2592000" always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://api.github.com; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
    # Never log the origin-auth header or query-string values.
    access_log /var/log/nginx/studynote.access.log studynote;
    error_log /var/log/nginx/studynote.error.log warn;

    error_page 404 /404.html;
    location = /404.html { internal; }
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        try_files $uri =404;
    }
    location ~ /\. { return 404; }
    location ~* \.map$ { return 404; }
    location / { try_files $uri $uri/ =404; }
}
