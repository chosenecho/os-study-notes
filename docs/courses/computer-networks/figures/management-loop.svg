<svg xmlns="http://www.w3.org/2000/svg" width="840" height="310" viewBox="0 0 840 310" role="img" aria-labelledby="title desc"><title id="title">接口管理中的读取与事件通报</title><desc id="desc">管理站主动 Get，代理返回接口状态；代理还可以主动 Trap 报告事件。SMI 描述规则，MIB 组织对象信息。</desc><rect width="840" height="310" rx="12" fill="#fff"/><g style="font-family:Arial,Microsoft YaHei,sans-serif;font-size:18px;fill:#17243b"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#315ba8"/></marker></defs>
<rect x="24" y="70" width="180" height="150" rx="10" fill="#e7f0ff" stroke="#315ba8"/>
<rect x="610" y="70" width="206" height="150" rx="10" fill="#e7f0ff" stroke="#315ba8"/>
<text x="52" y="112" font-size="22">管理站</text><text x="52" y="150">观察与决策</text><text x="52" y="188">关联请求/响应</text>
<text x="638" y="112" font-size="22">设备代理</text><text x="638" y="150">读取接口状态</text><text x="638" y="188">响应与报告事件</text>

<path d="M214 85H600" stroke="#315ba8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M600 153H214" stroke="#315ba8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M600 217H214" stroke="#315ba8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="408" y="67" text-anchor="middle">Get：读取接口变量</text>
<text x="408" y="136" text-anchor="middle">响应：值与差错信息</text>
<text x="408" y="200" text-anchor="middle">Trap：代理主动报告事件</text>
<text x="24" y="278">SMI 定义如何描述；MIB 组织对象与管理信息。</text></g></svg>
