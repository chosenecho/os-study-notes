<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360">
<rect width="1000" height="360" fill="#fff"/><g font-family="Microsoft YaHei, sans-serif" fill="#172033"><text x="500" y="42" text-anchor="middle" font-size="23" font-weight="700">时间片轮转调度示意（q = 2）</text>
<text x="58" y="145" font-size="17">CPU</text><g stroke="#64748b" stroke-width="1.5"><path d="M120 105V212M260 105V212M400 105V212M540 105V212M680 105V212M820 105V212M960 105V212"/><path d="M120 212H960"/></g>
<g><rect x="120" y="112" width="140" height="82" fill="#bae6fd" stroke="#0284c7"/><rect x="260" y="112" width="140" height="82" fill="#bbf7d0" stroke="#16a34a"/><rect x="400" y="112" width="140" height="82" fill="#fde68a" stroke="#d97706"/><rect x="540" y="112" width="140" height="82" fill="#bae6fd" stroke="#0284c7"/><rect x="680" y="112" width="140" height="82" fill="#bbf7d0" stroke="#16a34a"/><rect x="820" y="112" width="140" height="82" fill="#fde68a" stroke="#d97706"/></g>
<g text-anchor="middle" font-size="18"><text x="190" y="160">P1</text><text x="330" y="160">P2</text><text x="470" y="160">P3</text><text x="610" y="160">P1</text><text x="750" y="160">P2</text><text x="890" y="160">P3</text></g>
<g text-anchor="middle" font-size="14" fill="#475569"><text x="120" y="238">0</text><text x="260" y="238">2</text><text x="400" y="238">4</text><text x="540" y="238">6</text><text x="680" y="238">8</text><text x="820" y="238">10</text><text x="960" y="238">12</text></g>
<text x="120" y="285" font-size="16">每个进程最多连续运行一个时间片；未完成时回到就绪队列队尾。</text><text x="120" y="318" font-size="14" fill="#64748b">示意队列：P1、P2、P3 到达后按轮转顺序运行；实际时间轴取决于到达时刻和剩余服务时间。</text></g></svg>
