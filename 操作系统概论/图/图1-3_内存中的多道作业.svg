<svg xmlns="http://www.w3.org/2000/svg" width="620" height="330" viewBox="0 0 620 330" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="40" y="22" font-size="13" fill="#64748b">内存</text>
  <rect x="40" y="32" width="250" height="278" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>

  <rect x="40" y="32" width="250" height="46" fill="#e2e8f0" stroke="#2563eb" stroke-width="1.6"/>
  <text x="165" y="62" font-size="14" fill="#334155" text-anchor="middle">操作系统</text>

  <rect x="40" y="78" width="250" height="72" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="165" y="120" font-size="14" fill="#1e293b" text-anchor="middle">作业 1（等 I/O）</text>

  <rect x="40" y="150" width="250" height="72" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
  <text x="165" y="192" font-size="14" fill="#1e293b" text-anchor="middle">作业 2（占用 CPU）</text>

  <rect x="40" y="222" width="250" height="72" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="165" y="264" font-size="14" fill="#1e293b" text-anchor="middle">作业 3（等 I/O）</text>

  <rect x="390" y="110" width="180" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="480" y="145" font-size="15" fill="#1e3a8a" text-anchor="middle">CPU</text>

  <rect x="390" y="210" width="180" height="52" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="480" y="243" font-size="14" fill="#334155" text-anchor="middle">I/O 设备</text>

  <line x1="292" y1="186" x2="386" y2="152" stroke="#64748b" stroke-width="1.4" marker-end="url(#b)"/>
  <line x1="386" y1="168" x2="292" y2="202" stroke="#64748b" stroke-width="1.4" marker-end="url(#b)"/>
  <text x="338" y="132" font-size="12" fill="#64748b" text-anchor="middle">调度</text>

  <text x="310" y="318" font-size="13" fill="#64748b" text-anchor="middle">一道等 I/O 时，CPU 去跑另一道</text>
</svg>
