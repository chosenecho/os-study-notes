<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="40" y="18" width="160" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="120" y="46" font-size="14" fill="#1e293b" text-anchor="middle">应用程序</text>

  <rect x="240" y="18" width="160" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="320" y="46" font-size="14" fill="#1e293b" text-anchor="middle">编译程序</text>

  <rect x="440" y="18" width="160" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="520" y="46" font-size="14" fill="#1e293b" text-anchor="middle">数据库管理系统</text>

  <line x1="120" y1="62" x2="120" y2="92" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="320" y1="62" x2="320" y2="92" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="520" y1="62" x2="520" y2="92" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="608" y="82" font-size="12" fill="#64748b" text-anchor="middle">接口</text>

  <rect x="30" y="96" width="580" height="76" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="320" y="122" font-size="15" fill="#1e3a8a" text-anchor="middle" font-weight="bold">操作系统</text>
  <text x="110" y="152" font-size="13" fill="#334155" text-anchor="middle">处理机管理</text>
  <text x="250" y="152" font-size="13" fill="#334155" text-anchor="middle">内存管理</text>
  <text x="390" y="152" font-size="13" fill="#334155" text-anchor="middle">设备管理</text>
  <text x="530" y="152" font-size="13" fill="#334155" text-anchor="middle">文件管理</text>

  <line x1="320" y1="172" x2="320" y2="200" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="392" y="192" font-size="12" fill="#64748b" text-anchor="middle">硬件接口</text>

  <rect x="30" y="204" width="580" height="50" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="320" y="235" font-size="15" fill="#334155" text-anchor="middle">硬件（处理机、内存、设备）</text>

  <text x="320" y="292" font-size="13" fill="#64748b" text-anchor="middle">操作系统是覆盖在裸机上的第一层软件</text>
</svg>
