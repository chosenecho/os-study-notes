<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#92400e"/>
    </marker>
  </defs>

  <text x="300" y="22" font-size="13" fill="#64748b" text-anchor="middle">对外只提供系统调用这一层界面</text>

  <rect x="30" y="32" width="540" height="250" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
  <text x="300" y="56" font-size="13" fill="#92400e" text-anchor="middle">内核：所有软件和数据结构放在一个逻辑模块里</text>

  <rect x="55" y="72" width="150" height="58" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="130" y="108" font-size="14" fill="#1e293b" text-anchor="middle">子程序 A</text>

  <rect x="225" y="72" width="150" height="58" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="300" y="108" font-size="14" fill="#1e293b" text-anchor="middle">子程序 B</text>

  <rect x="395" y="72" width="150" height="58" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="470" y="108" font-size="14" fill="#1e293b" text-anchor="middle">子程序 C</text>

  <rect x="55" y="190" width="150" height="58" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="130" y="226" font-size="14" fill="#1e293b" text-anchor="middle">子程序 D</text>

  <rect x="225" y="190" width="150" height="58" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="300" y="226" font-size="14" fill="#1e293b" text-anchor="middle">子程序 E</text>

  <rect x="395" y="190" width="150" height="58" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="470" y="226" font-size="14" fill="#1e293b" text-anchor="middle">子程序 F</text>

  <line x1="205" y1="101" x2="221" y2="101" stroke="#92400e" stroke-width="1.3" marker-end="url(#c)"/>
  <line x1="375" y1="101" x2="391" y2="101" stroke="#92400e" stroke-width="1.3" marker-end="url(#c)"/>
  <line x1="300" y1="130" x2="300" y2="186" stroke="#92400e" stroke-width="1.3" marker-end="url(#c)"/>
  <line x1="395" y1="130" x2="207" y2="190" stroke="#92400e" stroke-width="1.3" marker-end="url(#c)"/>
  <line x1="205" y1="190" x2="393" y2="130" stroke="#92400e" stroke-width="1.3" marker-end="url(#c)" stroke-dasharray="5 3"/>
  <line x1="130" y1="190" x2="130" y2="134" stroke="#92400e" stroke-width="1.3" marker-end="url(#c)" stroke-dasharray="5 3"/>

  <text x="300" y="306" font-size="13" fill="#92400e" text-anchor="middle">无信息隐藏，任一子程序可调用其他子程序</text>
  <text x="300" y="326" font-size="13" fill="#64748b" text-anchor="middle">UNIX、MS-DOS、Linux、Mac OS X、BSD</text>
</svg>
