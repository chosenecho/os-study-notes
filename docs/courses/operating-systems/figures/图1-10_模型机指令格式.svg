<svg xmlns="http://www.w3.org/2000/svg" width="640" height="220" viewBox="0 0 640 220" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <text x="320" y="22" font-size="13" fill="#64748b" text-anchor="middle">一条指令 16 位</text>

  <rect x="60" y="36" width="140" height="46" fill="#fde68a" stroke="#d97706" stroke-width="1.6"/>
  <rect x="200" y="36" width="380" height="46" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="130" y="30" font-size="12" fill="#92400e" text-anchor="middle">操作码 4 位</text>
  <text x="390" y="30" font-size="12" fill="#1e3a8a" text-anchor="middle">地址码 12 位</text>
  <text x="130" y="65" font-size="14" fill="#1e293b" text-anchor="middle">做什么</text>
  <text x="390" y="65" font-size="14" fill="#1e293b" text-anchor="middle">对哪个内存单元做</text>

  <text x="60" y="106" font-size="13" fill="#334155">16 种操作码</text>
  <text x="240" y="106" font-size="13" fill="#334155">2¹² ＝ 4096 字节，地址用 3 位十六进制</text>

  <line x1="60" y1="120" x2="580" y2="120" stroke="#e2e8f0" stroke-width="1.2"/>

  <text x="66" y="146" font-size="13" fill="#1e293b">1940</text>
  <text x="130" y="146" font-size="13" fill="#92400e">0001</text>
  <text x="230" y="146" font-size="13" fill="#1e3a8a">940</text>
  <text x="320" y="146" font-size="13" fill="#64748b">从内存取数送入 AC</text>

  <text x="66" y="174" font-size="13" fill="#1e293b">5941</text>
  <text x="130" y="174" font-size="13" fill="#92400e">0101</text>
  <text x="230" y="174" font-size="13" fill="#1e3a8a">941</text>
  <text x="320" y="174" font-size="13" fill="#64748b">与 AC 相加，结果存 AC</text>

  <text x="66" y="202" font-size="13" fill="#1e293b">2941</text>
  <text x="130" y="202" font-size="13" fill="#92400e">0010</text>
  <text x="230" y="202" font-size="13" fill="#1e3a8a">941</text>
  <text x="320" y="202" font-size="13" fill="#64748b">把 AC 存入内存</text>
</svg>
