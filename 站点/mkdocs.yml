site_name: 课程笔记
site_description: 依据教材与考试大纲整理的课程笔记
site_url: !ENV [SITE_URL, 'https://studynote.chosenecho.dpdns.org/']
site_dir: dist
docs_dir: docs
theme:
  name: material
  custom_dir: overrides
  language: zh
  font: false
  favicon: assets/favicon.svg
  palette:
    - scheme: default
      primary: custom
      accent: blue
      media: "(prefers-color-scheme: light)"
      toggle:
        icon: material/weather-night
        name: 切换深色主题
    - scheme: slate
      primary: custom
      accent: blue
      media: "(prefers-color-scheme: dark)"
      toggle:
        icon: material/weather-sunny
        name: 切换浅色主题
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
nav:
  - 学习首页: index.md
  - 操作系统概论:
      - 第 1 章 操作系统简介: chapters/chapter-1.md
      - 第 2 章 进程管理: chapters/chapter-2.md
      - 第 3 章 进程调度与死锁: chapters/chapter-3.md
      - 第 4 章 内存管理: chapters/chapter-4.md
      - 第 5 章 文件系统: chapters/chapter-5.md
      - 第 6 章 I/O 设备管理: chapters/chapter-6.md
  - 计算机组成原理:
      - 第 1 章 计算机系统概述: computer-organization/chapter-1.md
      - 第 2 章 数据的表示和运算: computer-organization/chapter-2.md
      - 第 3 章 指令系统: computer-organization/chapter-3.md
      - 第 4 章 中央处理器: computer-organization/chapter-4.md
      - 第 5 章 存储器层次结构: computer-organization/chapter-5.md
      - 第 6 章 互连及输入输出组织: computer-organization/chapter-6.md
  - 交互练习:
      - 进程调度实验: lab/scheduling.md
plugins:
  - search:
      lang: [zh, en]
hooks:
  - hooks.py
markdown_extensions:
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.arithmatex:
      generic: true
extra_css:
  - assets/notes.css
  - assets/katex/katex.min.css
extra_javascript:
  - assets/math.js
  - assets/interactions.js
extra:
  generator: false
