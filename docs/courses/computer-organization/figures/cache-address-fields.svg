<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title"><title id="title">自编 Cache 地址字段和组内查找</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#365fa5"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="system-ui,Microsoft YaHei,sans-serif" fill="#17243b"><text x="30" y="42" font-size="25" text-anchor="start">32 位字节地址 · 4 KiB 数据区 · 32 B 块 · 2 路组相联</text><rect x="30" y="105" width="570" height="80" rx="6" fill="#edf3ff" stroke="#526b8a"/><text x="315.0" y="152.0" font-size="21" text-anchor="middle">标记 21 位 [31:11]</text><rect x="600" y="105" width="220" height="80" rx="6" fill="#edf3ff" stroke="#526b8a"/><text x="710.0" y="152.0" font-size="21" text-anchor="middle">组索引 6 位</text><rect x="820" y="105" width="150" height="80" rx="6" fill="#edf3ff" stroke="#526b8a"/><text x="895.0" y="152.0" font-size="21" text-anchor="middle">偏移 5 位</text><text x="30" y="225" font-size="23" text-anchor="start">0x129C = 4764：偏移 28，主存块号 148，组号 20，标记 2。</text><polyline points="710,187 710,267" fill="none" stroke="#365fa5" stroke-width="3" marker-end="url(#arrow)"/><rect x="465" y="270" width="490" height="60" rx="6" fill="#edf3ff" stroke="#526b8a"/><text x="710.0" y="306.6666666666667" font-size="20" text-anchor="middle">第 20 组：两路候选行（均须比较标记）</text><text x="30" y="375" font-size="23" text-anchor="start">组数 = 4096 ÷ (32 × 2) = 64；128 行不是 128 组。</text><text x="30" y="415" font-size="21" text-anchor="start">字段位数相加为 32；这里只计数据容量，标记和有效位另计。</text></g></svg>
